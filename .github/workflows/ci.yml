name: CI

# 只做两件低成本、高价值的事：
#   1. 所有受跟踪的 .py 能过 AST 解析（防手滑提交半截文件）
#   2. README / LICENSE 与代码事实一致（防文档漂移）
# 不做导入冒烟：本项目依赖 PySide6 + Windows API，装齐依赖再跑 import
# 需要数分钟且极易受模型文件缺失干扰，收益比不划算。等拆包完成后再补。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 语法与文档一致性
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 语法解析（受 git 跟踪的 .py）
        run: python scripts/dev/check_syntax.py

      - name: 文档漂移检查
        run: python scripts/dev/check_doc_drift.py --ci
